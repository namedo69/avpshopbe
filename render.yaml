services:
  - type: web
    name: csuc-shop-api
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.12.0
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
  - type: worker
    name: csuc-shop-worker
    runtime: node
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.12.0
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: PMOD_BASE_URL
        sync: false
      - key: PMOD_API_KEY
        sync: false
